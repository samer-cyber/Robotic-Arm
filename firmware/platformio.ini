; ---------------------------------------------------------------------------
;  Robotic arm - joint controller firmware
;  Target: ESP32-WROOM-32 (classic). 3x stepper via TMC2209, 4x servo
;  (J4 MG996R 270deg, J5/J6 MG995 270deg, GRIP MG995 180deg).
; ---------------------------------------------------------------------------
[platformio]
default_envs = wroom

[env:wroom]
platform      = espressif32
board         = esp32dev
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600
monitor_echo  = yes
monitor_eol   = LF

lib_deps =
    teemuatlut/TMCStepper@^0.7.3
    gin66/FastAccelStepper@^1.2.7

build_flags =
    -D CORE_DEBUG_LEVEL=0
    -Wall
