; ---------------------------------------------------------------------------
;  3DOF (-> 6DOF) arm test rig   |   3x TMC2209 over one UART bus
;
;  Two board targets. Build the one matching the MCU on the bench:
;    pio run -e wroom          (default)
;    pio run -e s3
;  In the VS Code PlatformIO sidebar they show up as separate environments.
; ---------------------------------------------------------------------------
[platformio]
default_envs = wroom

[common]
framework = arduino
platform  = espressif32
upload_speed  = 921600

; --- serial monitor -------------------------------------------------------
; monitor_echo shows you what you type (miniterm does not by default, so the
; monitor looks dead even when it is working). monitor_eol makes Enter send a
; newline rather than a carriage return.
; If you see garbage characters, drop BOTH this and HOST_BAUD in src/config.h
; to 115200 and reflash. They have to match.
monitor_speed  = 500000
monitor_echo   = yes
monitor_eol    = LF

; Versions left open on purpose: run `pio pkg list` once it builds and pin
; whatever it resolved, so future builds are reproducible.
lib_deps =
    teemuatlut/TMCStepper
    gin66/FastAccelStepper
    madhephaestus/ESP32Servo

; ---------------------------------------------------------------------------
;  ESP32-WROOM-32D / DevKit V1
;  FastAccelStepper drives steps from MCPWM + PCNT here, which is the reason
;  to prefer this part: it reaches 6 axes, where the S3 has a lower ceiling.
; ---------------------------------------------------------------------------
[env:wroom]
extends       = common
board         = esp32dev
build_flags   = -D CORE_DEBUG_LEVEL=0
                -D ARM_BOARD=1

; ---------------------------------------------------------------------------
;  ESP32-S3-DevKitC-1  (N16R8: 16 MB flash, octal PSRAM on GPIO33..37)
;  Plug into the UART socket, not the native USB one - native re-enumerates on
;  every reset and a host script loses the port handle.
; ---------------------------------------------------------------------------
[env:s3]
extends       = common
board         = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
build_flags   = -D CORE_DEBUG_LEVEL=0
                -D ARM_BOARD=2
                -D ARDUINO_USB_CDC_ON_BOOT=0
                -D ARDUINO_USB_MODE=1
